name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup debug keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > \
            "${{ github.workspace }}/android/app/debug.keystore"

      - name: Setup release keystore
        run: |
          KEYSTORE_PATH="${{ github.workspace }}/android/app/release.keystore"
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            echo "Release keystore restored"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias opencode-app \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "release_placeholder" \
              -keypass "release_placeholder" \
              -dname "CN=OpenCode App, OU=Dev, O=OpenCode, L=Shanghai, ST=Shanghai, C=CN"
            base64 -w 0 "$KEYSTORE_PATH" > /tmp/release_keystore.b64
            echo "Generated new keystore - save artifact as RELEASE_KEYSTORE_BASE64 secret"
          fi

      - name: Upload release keystore (first time setup)
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-base64
          path: /tmp/release_keystore.b64
          retention-days: 7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.RELEASE_STORE_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
