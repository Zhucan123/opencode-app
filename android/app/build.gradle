plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'ai.opencode.mobile'
    compileSdk 35
    ndkVersion "25.1.8937393"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        appDebug {
            def keystoreFile = file("debug.keystore")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android123'
                keyAlias 'code-app'
                keyPassword 'android123'
            }
        }
        appRelease {
            def releaseKeystore = file("release.keystore")
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: ''
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: ''
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: ''
            }
        }
    }

    defaultConfig {
        applicationId 'ai.opencode.mobile'
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.appDebug.storeFile?.exists()
                ? signingConfigs.appDebug
                : signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.appRelease.storeFile?.exists()
                ? signingConfigs.appRelease
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
